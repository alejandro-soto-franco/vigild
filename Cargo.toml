[workspace]
members = ["vigild-core", "vigild"]
resolver = "2"

[workspace.package]
rust-version = "1.89"

[profile.rpm]
inherits = "release"
opt-level = 3
debug = 2
codegen-units = 1
strip = "none"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
thiserror = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "4", features = ["tokio"] }
anyhow = "1"
